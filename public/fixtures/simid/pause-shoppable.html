<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIMID sample: pause shoppable</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; }
  #root { position: absolute; inset: 0; display: none; }
  #root.live { display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55); }
  .card {
    width: min(420px, 86%); padding: 18px; background: #141414; border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px; color: #fff; display: grid; grid-template-columns: 88px 1fr; gap: 14px;
  }
  img { width: 88px; height: 88px; object-fit: cover; border-radius: 8px; }
  .kicker { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.65; }
  h1 { margin: 4px 0 6px; font-size: 18px; }
  p { margin: 0 0 12px; font-size: 12px; opacity: 0.75; }
  .cta { padding: 8px 12px; border: 0; border-radius: 4px; background: #ed3628; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div id="root">
  <div class="card">
    <img alt="North Mug" src="https://dummyimage.com/176x176/3d2b1f/ffffff.png&text=Mug">
    <div>
      <div class="kicker">Pause ad · CTV portfolio</div>
      <h1>North Mug</h1>
      <p>Paused content. Scan or shop. SIMID sits on the pause placement, not mid-roll.</p>
      <button class="cta" id="shop" type="button">Shop $24</button>
    </div>
  </div>
</div>
<script src="simid-creative.js"></script>
<script>
  (function () {
    var simid = new SimidCreative();
    simid.onStart = function () {
      document.getElementById("root").classList.add("live");
      simid.reportTracking(["https://example.com/simid/pause/rendered"]);
    };
    simid.onAdSkipped = simid.onAdStopped = function () {
      document.getElementById("root").classList.remove("live");
    };
    document.getElementById("shop").addEventListener("click", function (event) {
      simid.reportTracking(["https://example.com/simid/pause/shop"]);
      simid.clickThru(event.clientX, event.clientY, true);
    });
    simid.connect();
  })();
</script>
</body>
</html>
