name: CI
on:
  pull_request:
  push:
    branches: [master, candidate, release, main-iab, iab-next-gen-vast-tester]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck:e2e
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e:subpath
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-node-${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
